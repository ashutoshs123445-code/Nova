<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create your Nova account</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stars"></div>
  <div class="flare"></div>

  <div class="card">
    <div class="brand">
      <span class="brand-mark">Nova</span>
    </div>
    <p class="tagline">Just Connect.</p>

    <h1 class="heading">Create your account</h1>

    <form id="signup-form" novalidate>
      <div class="field" id="field-name">
        <label for="name">Full name</label>
        <input type="text" id="name" autocomplete="name" required>
        <div class="field-error">Enter your name.</div>
      </div>

      <div class="field" id="field-email">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
        <div class="field-error">Enter a valid email address.</div>
      </div>

      <div class="field" id="field-phone">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" autocomplete="tel" required>
        <div class="field-error">Enter a valid phone number.</div>
      </div>

      <div class="field" id="field-password">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required>
        <div class="field-error">Password must be at least 8 characters.</div>
      </div>

      <div class="field" id="field-confirm">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" required>
        <div class="field-error">Passwords don't match.</div>
      </div>

      <button type="submit" class="primary" id="signup-btn">Create account</button>
      <div class="status-msg" id="signup-status"></div>
    </form>

    <p class="switch-link">Already on Nova? <a href="index.html">Log in</a></p>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
